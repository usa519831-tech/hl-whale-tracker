name: whale-snapshot

on:
  schedule:
    - cron: "7,37 * * * *"     # 매시 7분·37분 (정각 혼잡 회피)
  workflow_dispatch:            # 수동 실행 버튼

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 스냅샷 수집
        env:
          COINS: BTC,ETH,SOL
          MIN_VALUE: "5e6"
          MAX_ACCOUNTS: "800"
          WORKERS: "6"
        run: python collector.py

      - name: 결과 커밋
        run: |
          git config user.name  "whale-bot"
          git config user.email "whale-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME}
            git push
          fi
